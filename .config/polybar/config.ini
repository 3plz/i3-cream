; ============================================================
;  Wu-Tang Clan TUI-style Polybar config
;  Theme: Black & Wu-Tang Gold / Yellow (#FFB800)
;  Target: i3
; ============================================================

[colors]
background       = #0a0a0a
foreground       = #ffffff
foreground-alt   = #8c7b58
accent           = #ffb800
border           = #ffb800
active-bg        = #ffb800
active-fg        = #000000
urgent-bg        = #e53935
urgent-fg        = #ffffff

[bar/main]
monitor = ${env:MONITOR:}
override-redirect = true

width = 100%:-30
height = 28
offset-x = 15
offset-y = 0
radius = 0.0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 2
border-color = ${colors.border}

line-size = 3

padding-left = 1
padding-right = 1
module-margin = 1

separator = "│"
separator-foreground = ${colors.foreground-alt}

; Моноширинный шрифт и поддержка иконок/эмодзи
; Основной шрифт - Terminess Nerd Font (культовый пиксельный TUI-шрифт с иконками)
font-0 = "Terminess Nerd Font:size=11;2"
font-1 = "Terminess Nerd Font:style=Bold:size=11;2"
; Дополнительный ретро/аркадный шрифт Silkscreen для стильных надписей
font-2 = "Silkscreen:style=Bold:size=9;2"
; Кастомный шрифт с векторным логотипом Wu-Tang Clan
font-3 = "WuTangIcons:size=13;3"
; Эмодзи
font-4 = "Noto Color Emoji:scale=9;2"

modules-left = logo i3 xwindow
modules-center = date
modules-right = cpu memory pulseaudio wlan eth battery tray

tray-position = right
tray-padding = 2
tray-maxsize = 16
tray-background = ${colors.background}
tray-detached = false

wm-restack = i3
enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize

; ------------------------------------------------------------
; Логотип Wu-Tang Clan слева (кликер для запуска rofi)
; ------------------------------------------------------------
[module/logo]
type = custom/text
format = "%{T4}W%{T-} %{T3}WU-TANG%{T-} //"
format-foreground = ${colors.accent}
format-background = ${colors.background}
format-padding = 1
click-left = rofi -show drun -theme ~/.config/rofi/rofi-tui.rasi

; ------------------------------------------------------------
; Workspaces i3 - активный воркспейс залит золотым Wu-Tang
; ------------------------------------------------------------
[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
wrapping-scroll = false
enable-click = true
enable-scroll = false

format = <label-state>

label-focused = "[%index%]"
label-focused-foreground = ${colors.active-fg}
label-focused-background = ${colors.active-bg}
label-focused-padding = 1

label-unfocused = "[%index%]"
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-visible = "[%index%]"
label-visible-foreground = ${colors.foreground-alt}
label-visible-padding = 1

label-urgent = "[%index%]"
label-urgent-foreground = ${colors.urgent-fg}
label-urgent-background = ${colors.urgent-bg}
label-urgent-padding = 1

; ------------------------------------------------------------
; Заголовок активного окна
; ------------------------------------------------------------
[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.foreground-alt}

; ------------------------------------------------------------
; Дата/время по центру - "[ 19.11.2026 14:03 ]"
; ------------------------------------------------------------
[module/date]
type = internal/date
interval = 1
date = %d.%m.%Y %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}
format = <label>
format-prefix = "[ "
format-prefix-foreground = ${colors.accent}
format-suffix = " ]"
format-suffix-foreground = ${colors.accent}

; ------------------------------------------------------------
; CPU
; ------------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
label = "CPU %percentage:2%%"
label-foreground = ${colors.foreground}
format = <label>
format-prefix = "["
format-prefix-foreground = ${colors.foreground-alt}
format-suffix = "]"
format-suffix-foreground = ${colors.foreground-alt}

; ------------------------------------------------------------
; RAM
; ------------------------------------------------------------
[module/memory]
type = internal/memory
interval = 2
label = "MEM %percentage_used:2%%"
label-foreground = ${colors.foreground}
format = <label>
format-prefix = "["
format-prefix-foreground = ${colors.foreground-alt}
format-suffix = "]"
format-suffix-foreground = ${colors.foreground-alt}

; ------------------------------------------------------------
; Громкость (PulseAudio/PipeWire-pulse)
; ------------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = "["
format-volume-prefix-foreground = ${colors.foreground-alt}
format-volume-suffix = "]"
format-volume-suffix-foreground = ${colors.foreground-alt}
label-volume = "VOL %percentage%%"
label-volume-foreground = ${colors.foreground}

format-muted = <label-muted>
format-muted-prefix = "["
format-muted-prefix-foreground = ${colors.foreground-alt}
format-muted-suffix = "]"
format-muted-suffix-foreground = ${colors.foreground-alt}
label-muted = "VOL MUTED"
label-muted-foreground = ${colors.foreground-alt}

click-right = exec pavucontrol

; ------------------------------------------------------------
; Wi-Fi
; ------------------------------------------------------------
[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "["
format-connected-prefix-foreground = ${colors.foreground-alt}
format-connected-suffix = "]"
format-connected-suffix-foreground = ${colors.foreground-alt}
label-connected = "NET %essid%"
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "["
format-disconnected-prefix-foreground = ${colors.foreground-alt}
format-disconnected-suffix = "]"
format-disconnected-suffix-foreground = ${colors.foreground-alt}
label-disconnected = "NET OFFLINE"
label-disconnected-foreground = ${colors.foreground-alt}

; ------------------------------------------------------------
; Ethernet
; ------------------------------------------------------------
[module/eth]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "["
format-connected-prefix-foreground = ${colors.foreground-alt}
format-connected-suffix = "]"
format-connected-suffix-foreground = ${colors.foreground-alt}
label-connected = "ETH %local_ip%"
label-connected-foreground = ${colors.foreground}

format-disconnected =

; ------------------------------------------------------------
; Батарея
; ------------------------------------------------------------
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "["
format-charging-prefix-foreground = ${colors.foreground-alt}
format-charging-suffix = "]"
format-charging-suffix-foreground = ${colors.foreground-alt}
label-charging = "BAT %percentage%%+"

format-discharging = <label-discharging>
format-discharging-prefix = "["
format-discharging-prefix-foreground = ${colors.foreground-alt}
format-discharging-suffix = "]"
format-discharging-suffix-foreground = ${colors.foreground-alt}
label-discharging = "BAT %percentage%%"

format-full = <label-full>
format-full-prefix = "["
format-full-prefix-foreground = ${colors.foreground-alt}
format-full-suffix = "]"
format-full-suffix-foreground = ${colors.foreground-alt}
label-full = "BAT FULL"

[settings]
screenchange-reload = true
pseudo-transparency = false
